<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hinterland — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECE3CF; --paper2:#E2D6BC; --ink:#2F2B24; --ink-dim:rgba(47,43,36,.66); --ink-faint:rgba(47,43,36,.3);
  --sun:#B5843A; --sea:#9DB3B0; --night:#10161C; --ease:cubic-bezier(.45,0,.2,1);
  --serif:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#10161C; } }
:root[data-theme="dark"]{ --night:#10161C; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;font-family:var(--sans);color:var(--ink);
  background:radial-gradient(120% 90% at 30% 20%,#7d8f80 0%,#3b4a4a 45%,#141b20 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--sun);outline-offset:5px;border-radius:2px}

.sheet{position:absolute;inset:clamp(10px,2.4vw,28px);border-radius:3px;overflow:hidden;
  background:var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.08);
  opacity:0;transform:translateY(24px);animation:in .9s var(--ease) .15s forwards}
@keyframes in{to{opacity:1;transform:none}}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(140% 110% at 50% 45%,transparent 55%,rgba(110,84,46,.22) 100%)}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;opacity:.55}

header{position:absolute;top:0;left:0;right:0;display:flex;align-items:baseline;justify-content:space-between;
  padding:clamp(18px,3vw,34px) clamp(20px,4vw,52px) 0;z-index:3}
header h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,38px);margin:0;letter-spacing:.02em}
.tabs{display:flex;gap:clamp(16px,2.6vw,34px)}
.tabs button{font-size:15px;color:var(--ink-dim);padding:4px 0;border-bottom:1px solid transparent;transition:color .5s var(--ease),border-color .5s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.esc{font-size:13px;color:var(--ink-faint);font-weight:300}

.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility 0s linear .8s}
.view.on{opacity:1;visibility:visible;transition:opacity .8s var(--ease),visibility 0s}

/* map */
#map svg.chart{position:absolute;inset:clamp(60px,9vh,96px) 0 0 0;width:100%;height:calc(100% - clamp(60px,9vh,96px))}
.place{cursor:pointer}
.place .dot{transition:r .5s var(--ease)}
.place text{font-family:var(--serif);font-size:17px;fill:var(--ink);transition:fill .5s var(--ease)}
.place.locked text{font-family:var(--sans);font-style:italic;font-weight:300;font-size:13px;fill:var(--ink-faint)}
.place.sel text{fill:#000}
.place:focus{outline:none}
.place:focus-visible .ring{stroke:var(--sun);stroke-width:1.2}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s var(--ease) infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}

.panel{position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(20px,5vh,52px);width:min(380px,80vw);z-index:2}
.panel .kicker{font-size:13px;color:var(--ink-faint);font-weight:300;margin:0 0 6px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,3.6vw,46px);line-height:1;margin:0}
.panel .line{font-weight:300;font-size:16px;line-height:1.5;color:var(--ink-dim);margin:12px 0 18px}
.facts{display:flex;gap:26px;font-size:14px;margin:0 0 22px;color:var(--ink)}
.facts span{display:block;font-size:12px;color:var(--ink-faint);font-weight:300;margin-bottom:3px}
.cards{display:inline-flex;gap:5px;vertical-align:middle}
.cards i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink-dim)}
.cards i.got{background:var(--ink)}
.nav{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.nav button{position:relative;font-size:19px;color:var(--ink-dim);padding:6px 0;transition:color .6s var(--ease),padding .6s var(--ease)}
.nav button::before{content:"";position:absolute;left:0;top:50%;width:0;height:1px;background:var(--sun);transition:width .6s var(--ease)}
.nav button:hover,.nav button:focus-visible{color:var(--ink);padding-left:40px;outline:none}
.nav button:hover::before,.nav button:focus-visible::before{width:28px}
.nav button[hidden]{display:none}
.swap{transition:opacity .45s var(--ease)}
.swap.out{opacity:0}

/* garage */
#garage .stage{position:absolute;inset:clamp(70px,11vh,110px) 0 0 0;display:grid;grid-template-columns:1.3fr 1fr;align-items:center;padding:0 clamp(20px,5vw,70px) clamp(20px,5vh,50px)}
#garage svg{width:100%;max-height:62vh}
.mods h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,44px);margin:0}
.mods .line{font-weight:300;color:var(--ink-dim);margin:10px 0 26px;line-height:1.5}
.mods dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 26px;font-size:15px}
.mods dt{color:var(--ink-faint);font-weight:300}
.swatches{display:flex;gap:10px}
.swatches button{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink)}
.swatches button.lock{opacity:.25;cursor:default}
.vpick{display:flex;gap:22px;margin-bottom:28px}
.vpick button{font-size:15px;color:var(--ink-faint);border-bottom:1px solid transparent;padding:3px 0}
.vpick button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.vpick button:disabled{font-style:italic;cursor:default}

/* journal */
#journal .grid{position:absolute;inset:clamp(90px,13vh,130px) clamp(20px,5vw,70px) clamp(24px,5vh,50px);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px;overflow:auto;align-content:start}
.card{background:#F6F0E2;padding:10px 10px 12px;box-shadow:0 6px 18px rgba(60,40,10,.18)}
.card:nth-child(odd){transform:rotate(-1.2deg)} .card:nth-child(even){transform:rotate(.9deg)}
.card .ph{aspect-ratio:4/3;display:block;width:100%}
.card p{margin:10px 0 0;font-family:var(--serif);font-size:15px}
.card small{display:block;font-size:12px;color:var(--ink-faint);font-weight:300;margin-top:2px}
.card.empty{background:transparent;box-shadow:none;border:1px dashed var(--ink-faint);display:grid;place-items:center;aspect-ratio:4/3.9;color:var(--ink-faint);font-size:13px;font-weight:300;font-style:italic}

@media (max-width:760px){
  #garage .stage{grid-template-columns:1fr;align-content:start;gap:10px;overflow:auto}
  .panel{background:linear-gradient(transparent,var(--paper) 18%);padding-top:30px;left:0;right:0;width:auto;bottom:0;padding:30px 20px 22px}
  .esc{display:none}
}
@media (prefers-reduced-motion: reduce){ .sheet{animation-duration:.01s} .pulse{animation:none} }
</style>
</head>
<body>
<main class="sheet" aria-label="Atlas">
  <svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .35 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

  <header>
    <h1>Atlas</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-v="map">Map</button>
      <button role="tab" aria-selected="false" data-v="garage">Garage</button>
      <button role="tab" aria-selected="false" data-v="journal">Journal</button>
    </nav>
    <span class="esc">Esc to return</span>
  </header>

  <!-- MAP -->
  <section id="map" class="view on" aria-label="Map">
    <svg class="chart" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-hidden="false">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="6" stroke="#2F2B24" stroke-opacity=".18" stroke-width="1"/></pattern>
        <symbol id="peak" viewBox="-20 -24 40 26" overflow="visible"><path d="M-18 0 L-4 -20 L2 -12 L6 -17 L18 0" fill="none" stroke="#2F2B24" stroke-width="1.2" stroke-linejoin="round"/><path d="M-4 -20 L-2 0 M6 -17 L7 0" stroke="#2F2B24" stroke-opacity=".35" stroke-width=".8"/></symbol>
        <symbol id="tree" viewBox="-5 -12 10 13" overflow="visible"><path d="M0 -11 L4 -2 L-4 -2 Z M0 -2 V1" fill="none" stroke="#2F2B24" stroke-opacity=".55" stroke-width=".9" stroke-linejoin="round"/></symbol>
      </defs>
      <g id="ground"></g>
      <!-- sea and coast -->
      <path d="M1000 0 L850 0 C 830 70 880 120 850 180 C 820 240 900 280 880 340 C 860 420 930 470 900 560 L 890 620 L1000 620 Z" fill="#9DB3B0" fill-opacity=".38"/>
      <path d="M850 0 C 830 70 880 120 850 180 C 820 240 900 280 880 340 C 860 420 930 470 900 560 L 890 620" fill="none" stroke="#2F2B24" stroke-width="1.3"/>
      <g stroke="#2F2B24" stroke-opacity=".28" fill="none" stroke-width=".9">
        <path d="M900 90 q8 -4 16 0 t16 0"/><path d="M930 200 q8 -4 16 0 t16 0"/><path d="M945 330 q8 -4 16 0 t16 0"/><path d="M935 480 q8 -4 16 0 t16 0"/>
      </g>
      <!-- river -->
      <path d="M520 150 C 500 220 430 250 450 320 C 470 380 420 420 470 470 C 520 520 640 500 700 540 C 760 580 860 560 895 575" fill="none" stroke="#6E8F93" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M520 150 C 500 220 430 250 450 320 C 470 380 420 420 470 470 C 520 520 640 500 700 540 C 760 580 860 560 895 575" fill="none" stroke="#2F2B24" stroke-opacity=".5" stroke-width=".7" stroke-dasharray="1 5"/>
      <ellipse cx="505" cy="485" rx="34" ry="16" fill="#9DB3B0" fill-opacity=".5" stroke="#2F2B24" stroke-width="1"/>
      <!-- salt flat -->
      <ellipse cx="750" cy="420" rx="85" ry="38" fill="url(#hatch)" stroke="#2F2B24" stroke-opacity=".4" stroke-dasharray="3 4"/>
      <g fill="none" stroke="#2F2B24" stroke-opacity=".35" stroke-width=".9"><path d="M650 470 q10 -8 20 0 q10 8 20 0"/><path d="M690 485 q10 -8 20 0 q10 8 20 0"/></g>
      <!-- the spiral mountain -->
      <g transform="translate(330 235)">
        <path d="M-70 40 L0 -62 L70 40" fill="url(#hatch)" stroke="#2F2B24" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M-58 32 Q0 46 52 26 Q20 14 -40 18 Q-8 4 34 4 Q10 -10 -22 -8 Q0 -22 18 -24 Q6 -36 -6 -40" fill="none" stroke="#B5843A" stroke-width="1.4" stroke-dasharray="2 3"/>
        <path d="M-6 -48 L-2 -56 L2 -48 Z" fill="#2F2B24"/>
      </g>
      <!-- route: done part solid dots, future part faint -->
      <path id="routeDone" d="M245 445 C 230 380 270 320 318 300" fill="none" stroke="#2F2B24" stroke-width="1.6" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path id="routeFuture" fill="none" stroke="#2F2B24" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="1 7" stroke-linecap="round"/>
      <g id="places"></g>
      <!-- compass -->
      <g transform="translate(110 120)" stroke="#2F2B24" fill="none" stroke-width="1"><circle r="26" stroke-opacity=".4"/><path d="M0 -34 L5 0 L0 34 L-5 0 Z" fill="#2F2B24" fill-opacity=".12"/><path d="M-34 0 H34" stroke-opacity=".4"/><text y="-40" text-anchor="middle" font-family="Marcellus,serif" font-size="13" fill="#2F2B24" stroke="none">N</text></g>
    </svg>

    <aside class="panel swap" id="panel" aria-live="polite">
      <p class="kicker" id="pKick"></p>
      <h2 id="pTitle"></h2>
      <p class="line" id="pLine"></p>
      <div class="facts" id="pFacts"></div>
      <div class="nav">
        <button id="pBegin"></button>
        <button id="pWander">Wander here</button>
      </div>
    </aside>
  </section>

  <!-- GARAGE -->
  <section id="garage" class="view" aria-label="Garage">
    <div class="stage">
      <svg id="vehicleArt" viewBox="0 0 520 300" aria-label="Vehicle"></svg>
      <div class="mods">
        <div class="vpick" id="vpick">
          <button data-veh="rover" aria-pressed="false">Rover</button>
          <button data-veh="mule" aria-pressed="true">Mule</button>
          <button data-veh="snowcat" disabled>More found on journeys</button>
        </div>
        <h2 id="gName">The Mule</h2>
        <p class="line" id="gLine">Three wheels, a wooden rack and no hurry. Go slow on the corners.</p>
        <dl>
          <dt>Paint</dt><dd><div class="swatches" id="paints"></div></dd>
          <dt>Rack</dt><dd>Rope ties</dd>
          <dt>Tyres</dt><dd>Standard</dd>
          <dt>Charm</dt><dd>Little bell</dd>
          <dt>Horn</dt><dd>Two-tone</dd>
        </dl>
      </div>
    </div>
  </section>

  <!-- JOURNAL -->
  <section id="journal" class="view" aria-label="Journal">
    <div class="grid" id="cards"></div>
  </section>
</main>

<script>
(() => {
const J = [
  { id:"overlook", n:1, title:"The Overlook", line:"Find a way up to the light on the ridge.", veh:"Rover", len:"About twenty minutes", x:245, y:445, state:"done", cards:3 },
  { id:"longway", n:2, title:"The Long Way Up", line:"Six crates. One road. It goes round and round, and up.", veh:"Mule", len:"About forty minutes", x:318, y:300, state:"next", cards:0 },
  { id:"boulders", n:3, title:"Boulder Garden", line:"Hook, haul, and over. The gorge is in the way of everything.", veh:"Rover with winch", len:"About thirty minutes", x:385, y:455, state:"locked" },
  { id:"lantern", n:4, title:"Lantern River", line:"Five shrines along the water, and a village waiting for dusk.", veh:"Rover, on water", len:"About half an hour", x:470, y:380, state:"locked" },
  { id:"rounds", n:5, title:"Hut Rounds", line:"Five huts on the ridge, and each one needs something.", veh:"Mule", len:"About forty-five minutes", x:425, y:165, state:"locked" },
  { id:"firefly", n:6, title:"Firefly Road", line:"Follow the small lights through the old forest.", veh:"Rover", len:"About half an hour", x:600, y:300, state:"locked" },
  { id:"islands", n:7, title:"Lake of Islands", line:"Nine islands, one mail bag, and the Rover on the water again.", veh:"Rover, on water", len:"About thirty-five minutes", x:525, y:505, state:"locked" },
  { id:"snow", n:8, title:"First Snow", line:"Firewood for the cabin, before the pass closes.", veh:"Snowcat", len:"About forty minutes", x:560, y:140, state:"locked" },
  { id:"sky", n:9, title:"Sky Road", line:"Wings out. Up through the clouds, and whatever the sky brings.", veh:"Sky Mule", len:"About forty minutes", x:690, y:80, state:"locked" },
  { id:"market", n:10, title:"Market Day", line:"Seven stops, a bus full of neighbours, and a fair at dusk.", veh:"The Loaf (bus)", len:"About forty minutes", x:705, y:235, state:"locked" },
  { id:"salt", n:11, title:"The Salt Mirror", line:"A flat so wet it holds the whole sky.", veh:"Rover", len:"About twenty-five minutes", x:760, y:425, state:"locked" },
  { id:"coast", n:12, title:"Slow Coast", line:"Three coves, one camper, no hurry at all.", veh:"Tortoise", len:"About forty minutes", x:870, y:520, state:"locked" },
  { id:"light", n:13, title:"The Lighthouse", line:"One generator, one storm, one light to bring back.", veh:"Mule", len:"About thirty-five minutes", x:862, y:265, state:"locked" },
  { id:"above", n:14, title:"Above the Clouds", line:"Everywhere you have been, all at once.", veh:"Sky Mule", len:"As long as you like", x:905, y:110, state:"locked" }
];
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const $ = id => document.getElementById(id);

/* hand-placed ground features */
const ground = $("ground");
[[120,300],[175,230],[205,190],[420,170],[455,120],[520,90],[600,95],[650,150],[700,120],[640,60],[540,40],[260,140]].forEach(([x,y],i) => el("use", { href:"#peak", x:x-20, y:y-20, width:40, height:26, opacity: .55 + (i%3)*.15 }, ground));
const forest = (cx, cy, n, r) => { for (let i = 0; i < n; i++){ const a = i*2.39, d = Math.sqrt(i/n)*r; el("use", { href:"#tree", x:cx + Math.cos(a)*d*1.4 - 5, y:cy + Math.sin(a)*d - 12, width:10, height:13 }, ground); } };
forest(600, 330, 36, 46); forest(200, 420, 14, 30); forest(410, 410, 12, 24);
el("path", { d:"M60 560 Q160 520 240 560 T420 560", fill:"none", stroke:"#2F2B24", "stroke-opacity":".18" }, ground);

{ const pts = J.slice(1).map(p => [p.x, p.y]); let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){ const p0 = pts[Math.max(0, i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1, i+2)];
    d += ` C${p1[0] + (p2[0]-p0[0])/6} ${p1[1] + (p2[1]-p0[1])/6} ${p2[0] - (p3[0]-p1[0])/6} ${p2[1] - (p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`; }
  $("routeFuture").setAttribute("d", d); }
/* places */
const g = $("places"); let sel = 1;
J.forEach((p, i) => {
  const grp = el("g", { class:"place " + p.state, tabindex:0, role:"button", "aria-label": p.state === "locked" ? "Beyond the ridge" : p.title, transform:`translate(${p.x} ${p.y})` }, g);
  if (p.state === "next") el("circle", { r:9, fill:"none", stroke:"#B5843A", "stroke-width":1.2, class:"pulse" }, grp);
  el("circle", { r:14, fill:"transparent", stroke:"transparent", class:"ring" }, grp);
  if (p.state === "done"){
    el("circle", { r:6, fill:"#2F2B24", class:"dot" }, grp);
    const s = el("g", { transform:"translate(10 -10)", stroke:"#B5843A", "stroke-width":1 }, grp);
    for (let k = 0; k < 8; k++){ const a = k*Math.PI/4; el("line", { x1:Math.cos(a)*4, y1:Math.sin(a)*4, x2:Math.cos(a)*7, y2:Math.sin(a)*7 }, s); }
  } else if (p.state === "next") el("circle", { r:6, fill:"#ECE3CF", stroke:"#2F2B24", "stroke-width":1.6, class:"dot" }, grp);
  else el("circle", { r:4, fill:"none", stroke:"#2F2B24", "stroke-opacity":.35, "stroke-dasharray":"2 2", class:"dot" }, grp);
  const t = el("text", { x: 14, y: p.y < 160 ? 24 : -14 }, grp);
  t.textContent = p.state === "locked" ? "Beyond the ridge" : p.title;
  grp.addEventListener("click", () => select(i));
  grp.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); select(i); $("pBegin").focus(); } });
  p.node = grp;
});

function select(i){
  sel = i; const p = J[i];
  J.forEach((q, k) => q.node.classList.toggle("sel", k === i));
  const panel = $("panel"); panel.classList.add("out");
  setTimeout(() => {
    const locked = p.state === "locked";
    $("pKick").textContent = locked ? "Journey " + p.n : "Journey " + p.n + (p.state === "done" ? ", finished" : "");
    $("pTitle").textContent = locked ? "Beyond the ridge" : p.title;
    $("pLine").textContent = locked ? "Finish " + J[i-1].title + " to see what's out here." : p.line;
    $("pFacts").innerHTML = locked ? "" :
      `<div><span>Vehicle</span>${p.veh}</div><div><span>Length</span>${p.len}</div>` +
      `<div><span>Postcards</span><span class="cards">${[0,1,2,3,4].map(k => `<i class="${k < p.cards ? "got" : ""}"></i>`).join("")}</span></div>`;
    $("pBegin").hidden = locked; $("pWander").hidden = p.state !== "done";
    $("pBegin").textContent = p.state === "done" ? "Drive it again" : "Begin";
    panel.classList.remove("out");
  }, 300);
}
select(1);

addEventListener("keydown", e => {
  if (!$("map").classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ e.preventDefault(); const n = (sel + (e.key === "ArrowRight" ? 1 : -1) + J.length) % J.length; select(n); J[n].node.focus(); }
});
$("pBegin").onclick = () => { $("pBegin").textContent = "Loading Kettle Peak…"; };

/* tabs */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === b.dataset.v));
});

/* garage: vehicle drawings (side elevations, the same proportions Claude Code should model) */
const PAINTS = { mule:["#4F8C88","#C9643B","#3F5E8C","#D8B24A","#7A8F5A","#C9C1B0"], rover:["#C7AB78","#5F6E52","#9A4A35","#E5E0D2","#384A5A","#B98A3A"] };
const earned = { mule:2, rover:2 };
let veh = "mule", paint = { mule:0, rover:0 };
function wheel(s, x, y, r){ el("circle", { cx:x, cy:y, r, fill:"#2B2925" }, s); el("circle", { cx:x, cy:y, r:r*.48, fill:"#9C978C" }, s); el("circle", { cx:x, cy:y, r:r*.14, fill:"#2B2925" }, s); }
function drawMule(s, c){
  el("ellipse", { cx:260, cy:262, rx:200, ry:9, fill:"#2F2B24", opacity:.12 }, s);
  // rack bed
  el("rect", { x:210, y:150, width:240, height:62, fill:"#8A6A45", rx:3 }, s);
  for (let i = 0; i < 4; i++) el("rect", { x:210, y:150 + i*16, width:240, height:3, fill:"#6B5034" }, s);
  el("rect", { x:206, y:118, width:6, height:94, fill:"#6B5034" }, s); el("rect", { x:446, y:118, width:6, height:94, fill:"#6B5034" }, s);
  el("rect", { x:206, y:118, width:246, height:5, fill:"#6B5034" }, s);
  // crates + rope
  [[226,96,70,54],[302,104,60,46],[368,92,66,58],[262,58,58,40]].forEach(([x,y,w,h]) => { el("rect", { x, y, width:w, height:h, fill:"#C4A16C", stroke:"#7C5F3A", "stroke-width":2 }, s); el("path", { d:`M${x+4} ${y+4} L${x+w-4} ${y+h-4} M${x+w-4} ${y+4} L${x+4} ${y+h-4}`, stroke:"#9A7C50", "stroke-width":1.5 }, s); });
  el("path", { d:"M212 120 Q300 70 452 118", fill:"none", stroke:"#D9C9A0", "stroke-width":2 }, s);
  // chassis
  el("rect", { x:120, y:208, width:330, height:12, fill:"#3A3631" }, s);
  // cab
  el("path", { d:"M70 214 L70 128 Q72 82 120 74 L196 70 Q214 70 214 90 L214 214 Z", fill:c }, s);
  el("path", { d:"M66 80 Q120 56 218 64 L218 74 Q120 66 66 90 Z", fill:"#E6DCC4" }, s);
  el("path", { d:"M86 132 Q90 96 124 90 L150 88 L150 132 Z", fill:"#BFD2D3", stroke:"#2F2B24", "stroke-opacity":.3 }, s);
  el("rect", { x:160, y:88, width:42, height:62, fill:"#BFD2D3", stroke:"#2F2B24", "stroke-opacity":.3 }, s);
  el("rect", { x:70, y:176, width:144, height:6, fill:"#000", opacity:.12 }, s);
  el("circle", { cx:66, cy:160, r:11, fill:"#FFF1CF", stroke:"#2F2B24", "stroke-width":2 }, s);
  el("path", { d:"M150 70 L150 52", stroke:"#2F2B24", "stroke-width":1.5 }, s); el("circle", { cx:150, cy:50, r:4, fill:"#D8B24A" }, s);
  el("rect", { x:428, y:214, width:8, height:30, fill:"#2B2925" }, s);
  wheel(s, 104, 236, 28); wheel(s, 380, 236, 28);
}
function drawRover(s, c){
  el("ellipse", { cx:260, cy:262, rx:210, ry:9, fill:"#2F2B24", opacity:.12 }, s);
  el("rect", { x:52, y:150, width:410, height:66, rx:6, fill:c }, s);
  el("rect", { x:48, y:206, width:418, height:18, rx:4, fill:"#2A2E31" }, s);
  el("path", { d:"M170 150 L186 82 L414 82 L424 150 Z", fill:"#24313A" }, s);
  el("rect", { x:180, y:74, width:250, height:10, fill:c }, s);
  el("rect", { x:290, y:84, width:10, height:66, fill:c }, s);
  el("rect", { x:196, y:58, width:230, height:5, fill:"#8E908C" }, s); el("rect", { x:250, y:38, width:120, height:22, fill:"#2A2E31" }, s);
  el("rect", { x:52, y:164, width:10, height:12, fill:"#FFF1CF" }, s);
  el("circle", { cx:470, cy:168, r:30, fill:"#2B2925" }, s);
  wheel(s, 132, 230, 40); wheel(s, 384, 230, 40);
}
function drawGarage(){
  const s = $("vehicleArt"); s.innerHTML = "";
  const c = PAINTS[veh][paint[veh]];
  veh === "mule" ? drawMule(s, c) : drawRover(s, c);
  $("gName").textContent = veh === "mule" ? "The Mule" : "The Rover";
  $("gLine").textContent = veh === "mule" ? "Three wheels, a wooden rack and no hurry. Go slow on the corners." : "Steady on almost anything. The one you started with.";
  const sw = $("paints"); sw.innerHTML = "";
  PAINTS[veh].forEach((hex, i) => {
    const b = document.createElement("button"); b.style.background = hex;
    const ok = i < earned[veh]; b.className = ok ? "" : "lock";
    b.setAttribute("aria-label", ok ? "Paint " + (i+1) : "Earned on a later journey");
    b.setAttribute("aria-pressed", i === paint[veh]);
    if (ok) b.onclick = () => { paint[veh] = i; drawGarage(); };
    sw.appendChild(b);
  });
}
document.querySelectorAll("#vpick button:not([disabled])").forEach(b => b.onclick = () => {
  veh = b.dataset.veh; document.querySelectorAll("#vpick button").forEach(x => x.setAttribute("aria-pressed", x === b)); drawGarage();
});
drawGarage();

/* journal */
const shots = [
  { t:"The Overlook", s:"Late morning", sky:["#9FC1DC","#F1D7A8"], g:"#5E7A3A" },
  { t:"Highfall", s:"Morning", sky:["#B9D0DE","#E7EEF0"], g:"#4F6B46" },
  { t:"The Tarn", s:"Golden hour", sky:["#E9A86A","#F7D9A0"], g:"#4A5B3C" }
];
const cards = $("cards");
shots.forEach((p, i) => {
  const d = document.createElement("figure"); d.className = "card"; d.style.margin = 0;
  d.innerHTML = `<svg class="ph" viewBox="0 0 160 120"><defs><linearGradient id="s${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs>
  <rect width="160" height="120" fill="url(#s${i})"/><path d="M0 80 L40 44 L62 62 L92 30 L130 70 L160 56 L160 120 L0 120Z" fill="#8C8FA0" opacity=".55"/>
  <path d="M0 96 Q60 78 160 92 L160 120 L0 120Z" fill="${p.g}"/></svg><p>${p.t}</p><small>${p.s}</small>`;
  cards.appendChild(d);
});
for (let i = 0; i < 5; i++){ const d = document.createElement("div"); d.className = "card empty"; d.textContent = "Not found yet"; cards.appendChild(d); }
})();
</script>
</body>
