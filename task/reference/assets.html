<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hinterland — Asset Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECE3CF; --paper2:#E4D9C1; --ink:#2F2B24; --ink-dim:rgba(47,43,36,.68); --ink-faint:rgba(47,43,36,.34);
  --sun:#B5843A; --plan:#E6E9E3; --grid:rgba(60,90,110,.12); --grid2:rgba(60,90,110,.22);
  --ease:cubic-bezier(.45,0,.2,1);
  --serif:"Marcellus","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#ECE3CF; } }
:root[data-theme="dark"]{ --paper:#ECE3CF; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--sun);outline-offset:4px;border-radius:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

.app{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;height:100%}
aside.index{border-right:1px solid var(--ink-faint);padding:26px 22px;overflow:auto}
.brand{font-family:var(--serif);font-size:24px;margin:0}
.sub{font-size:13px;font-weight:300;color:var(--ink-faint);margin:4px 0 26px}
.grp{font-size:12px;letter-spacing:.06em;color:var(--ink-faint);margin:20px 0 8px}
.index button{display:block;width:100%;text-align:left;font-size:15px;color:var(--ink-dim);padding:5px 0;transition:color .4s var(--ease),padding .4s var(--ease);position:relative}
.index button::before{content:"";position:absolute;left:0;top:50%;width:0;height:1px;background:var(--sun);transition:width .4s var(--ease)}
.index button:hover{color:var(--ink)}
.index button[aria-current="true"]{color:var(--ink);padding-left:24px}
.index button[aria-current="true"]::before{width:16px}
.index a{display:block;margin-top:28px;font-size:14px;color:var(--ink)}

main{display:flex;flex-direction:column;padding:22px 26px;min-width:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3vw,42px);margin:0}
.head p{margin:2px 0 0;color:var(--ink-dim);font-weight:300}
.seg{display:flex;gap:18px;font-size:14px}
.seg button{color:var(--ink-faint);border-bottom:1px solid transparent;padding:2px 0}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--sun)}
.stage{flex:1;margin-top:16px;border-radius:4px;position:relative;overflow:hidden;min-height:300px;transition:background 1.2s var(--ease)}
.stage.morning{background:linear-gradient(#A9C6DA 0%,#DCE6E6 55%,#E9E2CF 100%)}
.stage.golden{background:linear-gradient(#7E8FB0 0%,#F0B98A 55%,#F2D6A6 100%)}
.stage.night{background:linear-gradient(#0E1626 0%,#24324A 60%,#3A3A44 100%)}
.stage .hint{position:absolute;left:16px;bottom:12px;font-size:12px;font-weight:300;color:rgba(47,43,36,.5);z-index:3}
.stage.night .hint{color:rgba(240,235,225,.5)}

aside.spec{border-left:1px solid var(--ink-faint);padding:22px 22px 28px;overflow:auto}
.ortho{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.view{position:relative;aspect-ratio:1/1;background-color:var(--plan);border-radius:2px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:10px 10px,10px 10px,50px 50px,50px 50px;box-shadow:inset 0 0 0 1px rgba(60,90,110,.25)}
.view span{position:absolute;left:8px;top:6px;font-size:11px;letter-spacing:.06em;color:rgba(40,70,90,.75);z-index:3}
.view em{position:absolute;right:8px;bottom:6px;font-size:11px;font-style:normal;color:rgba(40,70,90,.75);z-index:3}
h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:24px 0 10px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sw{font-size:11px;color:var(--ink-dim)}
.sw i{display:block;height:26px;border-radius:2px;margin-bottom:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
ul{margin:0;padding-left:18px;font-size:14px;line-height:1.55;font-weight:300}
li{margin-bottom:6px}
.fix{background:rgba(181,132,58,.12);border-left:2px solid var(--sun);padding:10px 12px;font-size:13.5px;line-height:1.5;font-weight:300}
code{font-size:12.5px;background:rgba(47,43,36,.07);padding:1px 5px;border-radius:2px}

@media (max-width:1100px){
  body{overflow:auto} .app{grid-template-columns:1fr;height:auto}
  aside.index{border:0;border-bottom:1px solid var(--ink-faint);display:flex;flex-wrap:wrap;gap:4px 18px;padding:18px}
  aside.index .sub,aside.index .grp{width:100%} .index button{width:auto}
  .stage{height:62vh;flex:none}
  aside.spec{border:0}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="app">
  <aside class="index" id="index">
    <p class="brand">Asset Lab</p>
    <p class="sub">Planning sheets for every model. Each one is a working builder Claude Code ports to TS.</p>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="name"></h1><p id="dims"></p></div>
      <div class="seg" id="light"><button data-l="morning">Morning</button><button data-l="golden" aria-pressed="true">Golden hour</button><button data-l="night">Night</button></div>
    </div>
    <div class="stage golden" id="stage"><div class="hint">Drag to turn · scroll to zoom</div></div>
  </main>
  <aside class="spec">
    <div class="ortho">
      <div class="view" id="vFront"><span>FRONT</span><em id="eFront"></em></div>
      <div class="view" id="vSide"><span>SIDE (RIGHT)</span><em id="eSide"></em></div>
      <div class="view" id="vBack"><span>BACK</span><em></em></div>
      <div class="view" id="vTop"><span>TOP</span><em id="eTop"></em></div>
    </div>
    <h3>Palette</h3><div class="pal" id="pal"></div>
    <h3>Build rules</h3><ul id="notes"></ul>
    <h3>What this fixes</h3><div class="fix" id="fix"></div>
    <h3>Port to</h3><p id="port" style="font-size:14px;font-weight:300;margin:0"></p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
/* ============================================================
   CORE HELPERS (port as src/game/art/kit.ts)
============================================================ */
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const matCache = new Map();
function M(hex, rough = .8, metal = 0, extra){
  const k = hex + rough + metal + JSON.stringify(extra || {});
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial(Object.assign({ color: lin(hex), roughness: rough, metalness: metal }, extra || {})));
  return matCache.get(k);
}
const VC = (rough = .9, extra) => new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: rough, flatShading: true }, extra || {}));
const emissives = []; // [{mat, base}] scaled by light preset
function glow(hex, base){ const m = new THREE.MeshStandardMaterial({ color: lin(hex), emissive: lin(hex), emissiveIntensity: base, roughness: .4 }); emissives.push({ m, base }); return m; }
function add(parent, geo, mat, p, r, s){
  const m = new THREE.Mesh(geo, mat);
  if (p) m.position.set(p[0], p[1], p[2]);
  if (r) m.rotation.set(r[0], r[1], r[2]);
  if (s) typeof s === "number" ? m.scale.setScalar(s) : m.scale.set(s[0], s[1], s[2]);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 12) => new THREE.CylinderGeometry(rt, rb, h, seg);
function rng(seed){ let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
function h3(x, y, z){ const s = Math.sin(x*127.1 + y*311.7 + z*74.7)*43758.5453; return s - Math.floor(s); }
function n3(x, y, z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf), w = zf*zf*(3-2*zf), L = (a, b, t) => a + (b - a)*t;
  const c = (i, j, k) => h3(xi+i, yi+j, zi+k);
  return L(L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v), L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w)*2 - 1;
}
/* paint a flat-shaded geometry face by face: fn(centroid, normal, faceIndex) -> THREE.Color */
function paintFaces(geo, fn){
  geo = geo.index ? geo.toNonIndexed() : geo;
  geo.computeVertexNormals();
  const p = geo.attributes.position, n = geo.attributes.normal, cols = new Float32Array(p.count*3);
  const c = new THREE.Vector3(), nn = new THREE.Vector3();
  for (let f = 0; f < p.count/3; f++){
    c.set(0,0,0); nn.set(0,0,0);
    for (let k = 0; k < 3; k++){ const i = f*3 + k; c.x += p.getX(i)/3; c.y += p.getY(i)/3; c.z += p.getZ(i)/3; nn.x += n.getX(i); nn.y += n.getY(i); nn.z += n.getZ(i); }
    nn.normalize();
    const col = fn(c, nn, f);
    for (let k = 0; k < 3; k++){ const i = (f*3 + k)*3; cols[i] = col.r; cols[i+1] = col.g; cols[i+2] = col.b; }
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  return geo;
}
const C = h => lin(h);
const mixC = (a, b, t) => a.clone().lerp(b, Math.max(0, Math.min(1, t)));
function catenary(a, b, sag, seg = 16){ const mid = a.clone().lerp(b, .5); mid.y -= sag; return new THREE.QuadraticBezierCurve3(a, mid, b); }
const tube = (curve, r, seg = 20, rad = 6) => new THREE.TubeGeometry(curve, seg, r, rad, false);

/* ============================================================
   ASSET: WHEEL (shared by all vehicles)
============================================================ */
function buildWheel(r, w, opts = {}){
  const g = new THREE.Group(), inner = r*.6, rr = Math.min(w*.32, r*.18), pts = [];
  pts.push(new THREE.Vector2(inner, -w/2));
  for (let i = 0; i <= 5; i++){ const a = -Math.PI/2 + i/5*Math.PI/2; pts.push(new THREE.Vector2(r - rr + Math.cos(a)*rr, -w/2 + rr + Math.sin(a)*rr)); }
  for (let i = 0; i <= 5; i++){ const a = i/5*Math.PI/2; pts.push(new THREE.Vector2(r - rr + Math.cos(a)*rr, w/2 - rr + Math.sin(a)*rr)); }
  pts.push(new THREE.Vector2(inner, w/2));
  const tire = new THREE.LatheGeometry(pts, 28); tire.rotateZ(Math.PI/2);
  const rubber = M("#232220", .95);
  add(g, tire, rubber);
  const n = opts.blocks || 22;
  for (let i = 0; i < n; i++){
    const a = i/n*Math.PI*2, side = i % 2 ? 1 : -1;
    const b = add(g, box(w*.42, r*.09, r*.16), rubber, [side*w*.2, Math.cos(a)*(r + r*.02), Math.sin(a)*(r + r*.02)], [a, 0, 0]);
    b.castShadow = false;
  }
  const rim = M(opts.rim || "#B9B4A8", .35, .7);
  add(g, cyl(inner*.98, inner*.98, w*.72, 20), rim, null, [0, 0, Math.PI/2]);
  add(g, cyl(inner*.55, inner*.7, w*.8, 16), M(opts.hub || "#8E897F", .4, .6), null, [0, 0, Math.PI/2]);
  for (let i = 0; i < 5; i++){ const a = i/5*Math.PI*2; add(g, cyl(r*.035, r*.035, w*.86, 6), M("#4A4740", .5, .6), [0, Math.cos(a)*inner*.38, Math.sin(a)*inner*.38], [0, 0, Math.PI/2]); }
  return g;
}

/* ============================================================
   ASSET: CRATE (cargo; physics collider = its bounding box)
============================================================ */
function buildCrate(w, h, d, seed = 1){
  const g = new THREE.Group(), rnd = rng(seed);
  const tones = ["#C9A56C", "#BE9960", "#D3B07A", "#B88F58"], plank = () => M(tones[Math.floor(rnd()*tones.length)], .85);
  const batten = M("#8C6A42", .85), t = .022, gap = .012;
  const rows = Math.max(2, Math.round(h/.13)), ph = (h - gap*(rows - 1))/rows;
  for (let i = 0; i < rows; i++){
    const y = -h/2 + ph/2 + i*(ph + gap);
    add(g, box(w, ph, t), plank(), [0, y, d/2 - t/2]); add(g, box(w, ph, t), plank(), [0, y, -d/2 + t/2]);
    add(g, box(t, ph, d - t*2), plank(), [w/2 - t/2, y, 0]); add(g, box(t, ph, d - t*2), plank(), [-w/2 + t/2, y, 0]);
  }
  const tops = Math.max(2, Math.round(w/.14)), tw = (w - gap*(tops - 1))/tops;
  for (let i = 0; i < tops; i++) add(g, box(tw, t, d), plank(), [-w/2 + tw/2 + i*(tw + gap), h/2 - t/2, 0]);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(g, box(.05, h + .01, .05), batten, [sx*(w/2 - .015), 0, sz*(d/2 - .015)]);
  for (const sz of [-1, 1]){ const diag = Math.hypot(w, h)*.92; add(g, box(diag, .055, .02), batten, [0, 0, sz*(d/2 + .006)], [0, 0, Math.atan2(h, w)*(sz)]); }
  return g;
}

/* ============================================================
   ASSET: MULE (3-wheel cargo auto). Forward = -Z. Units = meters.
============================================================ */
function buildMule(opts = {}){
  const g = new THREE.Group(), Y = .2, W = 1.26;
  const paint = M(opts.paint || "#4F8C88", .5, .12), paintD = M(opts.paintDark || "#3C6F6B", .55, .12);
  const cream = M("#E6DCC4", .6), chrome = M("#D2D4D0", .22, .9), dark = M("#2B2A27", .8), rubber = M("#232220", .95);
  const glassM = new THREE.MeshStandardMaterial({ color: lin("#9CC2C8"), roughness: .05, metalness: .2, transparent: true, opacity: .45 });
  const interior = M("#1E2A2C", .9);
  // cab shell: side profile (z,y) extruded across X with a soft bevel
  const s = new THREE.Shape();
  s.moveTo(-.32, .42 + Y); s.lineTo(-1.28, .42 + Y);
  s.quadraticCurveTo(-1.52, .44 + Y, -1.53, .74 + Y);
  s.lineTo(-1.50, .98 + Y); s.lineTo(-1.31, 1.70 + Y);
  s.quadraticCurveTo(-1.28, 1.77 + Y, -1.18, 1.77 + Y);
  s.lineTo(-.42, 1.77 + Y); s.quadraticCurveTo(-.32, 1.77 + Y, -.32, 1.67 + Y); s.lineTo(-.32, .42 + Y);
  const cabG = new THREE.ExtrudeGeometry(s, { depth: W, bevelEnabled: true, bevelThickness: .06, bevelSize: .06, bevelSegments: 4, curveSegments: 12 });
  cabG.rotateY(-Math.PI/2); cabG.translate(W/2, 0, 0);
  add(g, cabG, paint);
  // lower two-tone skirt + belt line
  for (const sx of [-1, 1]){
    add(g, box(.02, .3, 1.14), paintD, [sx*(W/2 + .065), .62 + Y, -.9]);
    add(g, box(.025, .035, 1.16), chrome, [sx*(W/2 + .068), .8 + Y, -.9]);
  }
  // windscreen: interior + glass + rubber seal + wiper
  const ang = Math.atan2(.19, .72), wsLen = Math.hypot(.19, .72);
  const ws = new THREE.Group(); ws.position.set(0, 1.34 + Y, -1.47); ws.rotation.x = ang; g.add(ws);
  add(ws, new THREE.PlaneGeometry(W - .1, wsLen - .1), interior, [0, 0, -.052], [0, Math.PI, 0]);
  add(ws, new THREE.PlaneGeometry(W - .1, wsLen - .1), glassM, [0, 0, -.062], [0, Math.PI, 0]).castShadow = false;
  for (const [w, h, x, y] of [[W - .06, .03, 0, (wsLen - .07)/2], [W - .06, .03, 0, -(wsLen - .07)/2], [.03, wsLen - .06, (W - .07)/2, 0], [.03, wsLen - .06, -(W - .07)/2, 0]]) add(ws, box(w, h, .02), rubber, [x, y, -.06]);
  add(ws, box(.5, .018, .015), dark, [.12, -.2, -.075], [0, 0, .5]);
  // side windows (door glass) + door seam + handle
  const sw = new THREE.Shape(); sw.moveTo(-1.35, 1.06 + Y); sw.lineTo(-.56, 1.06 + Y); sw.lineTo(-.56, 1.6 + Y); sw.lineTo(-1.2, 1.6 + Y); sw.lineTo(-1.35, 1.06 + Y);
  for (const sx of [-1, 1]){
    const gi = new THREE.ShapeGeometry(sw); gi.rotateY(-Math.PI/2);
    add(g, gi, interior, [sx*(W/2 + .062), 0, 0]).material.side = THREE.DoubleSide;
    const gg = new THREE.ShapeGeometry(sw); gg.rotateY(-Math.PI/2);
    const gl = add(g, gg, glassM, [sx*(W/2 + .07), 0, 0]); gl.castShadow = false; glassM.side = THREE.DoubleSide;
    add(g, box(.015, 1.22, .015), paintD, [sx*(W/2 + .066), 1.05 + Y, -.5]);
    add(g, box(.03, .03, .12), chrome, [sx*(W/2 + .08), .98 + Y, -.66]);
  }
  // roof: rounded slab with overhang + gutter
  const rr = new THREE.Shape(), RL = 1.42, RW = 1.46, rc = .14;
  rr.moveTo(-RW/2 + rc, -RL/2); rr.lineTo(RW/2 - rc, -RL/2); rr.quadraticCurveTo(RW/2, -RL/2, RW/2, -RL/2 + rc); rr.lineTo(RW/2, RL/2 - rc); rr.quadraticCurveTo(RW/2, RL/2, RW/2 - rc, RL/2);
  rr.lineTo(-RW/2 + rc, RL/2); rr.quadraticCurveTo(-RW/2, RL/2, -RW/2, RL/2 - rc); rr.lineTo(-RW/2, -RL/2 + rc); rr.quadraticCurveTo(-RW/2, -RL/2, -RW/2 + rc, -RL/2);
  const roofG = new THREE.ExtrudeGeometry(rr, { depth: .05, bevelEnabled: true, bevelThickness: .02, bevelSize: .02, bevelSegments: 2 }); roofG.rotateX(Math.PI/2);
  add(g, roofG, cream, [0, 1.92 + Y, -.92]);
  add(g, box(RW - .1, .04, RL - .1), M("#D6CBB1", .7), [0, 1.86 + Y, -.92]);
  // nose: headlight pod, indicators, horn grille, plate
  const pod = add(g, cyl(.13, .14, .12, 20), paint, [0, .82 + Y, -1.6], [Math.PI/2, 0, 0]);
  add(g, new THREE.TorusGeometry(.12, .018, 8, 24), chrome, [0, .82 + Y, -1.665]);
  add(g, new THREE.CircleGeometry(.11, 24), glow("#FFF1CF", .9), [0, .82 + Y, -1.668], [0, Math.PI, 0]);
  for (const sx of [-1, 1]) add(g, box(.09, .05, .04), glow("#F2A03A", .35), [sx*.52, .64 + Y, -1.55]);
  for (let i = 0; i < 4; i++) add(g, box(.36, .012, .02), dark, [0, .5 + Y + i*.03, -1.56]);
  add(g, box(.32, .09, .015), M("#E8C547", .6), [0, .32 + Y, -1.56]);
  // front wheel, fork, mudguard
  const fw = buildWheel(.32, .2, { blocks: 20 }); fw.position.set(0, .32, -1.2); g.add(fw);
  const guard = new THREE.CylinderGeometry(.4, .4, .26, 18, 1, true, -Math.PI*.15, Math.PI*.95); guard.rotateZ(Math.PI/2);
  add(g, guard, paint, [0, .32, -1.2]).material.side = THREE.DoubleSide;
  for (const sx of [-1, 1]) add(g, cyl(.025, .025, .5, 8), chrome, [sx*.14, .55, -1.12], [-.25, 0, 0]);
  // mirrors on stalks + bell charm
  for (const sx of [-1, 1]){
    const a = new THREE.Vector3(sx*.62, 1.02 + Y, -1.42), b = new THREE.Vector3(sx*.86, 1.26 + Y, -1.4);
    add(g, tube(new THREE.QuadraticBezierCurve3(a, new THREE.Vector3(sx*.84, 1.04 + Y, -1.44), b), .012, 12, 6), dark);
    const mh = add(g, new THREE.SphereGeometry(.1, 14, 10), dark, [sx*.88, 1.3 + Y, -1.4], null, [.75, 1.1, .28]);
    add(g, new THREE.CircleGeometry(.08, 18), chrome, [sx*.88, 1.3 + Y, -1.37], null, [1, 1.35, 1]);
    if (sx === 1){
      add(g, tube(new THREE.LineCurve3(new THREE.Vector3(.86, 1.2 + Y, -1.4), new THREE.Vector3(.86, 1.05 + Y, -1.4)), .004, 2, 4), M("#B23B2E", .9));
      const bell = new THREE.LatheGeometry([[0,.06],[.025,.055],[.035,.02],[.045,0],[0,0]].map(p => new THREE.Vector2(p[0], p[1])), 12);
      add(g, bell, M("#C8A24A", .3, .9), [.86, .98 + Y, -1.4]);
    }
  }

function bladeGeo(w = .045, h = .55, bend = .18){

}

/* ============================================================
   VIEWER (not ported; this is the lab itself)
============================================================ */
const canvas = document.getElementById("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e){ document.querySelector(".stage .hint").textContent = "WebGL is off in this browser, so the models can't render. The build rules on the right still apply."; return; }
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xcfe0ee, 0x5a5040, .7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .02; scene.add(sun, sun.target);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI/2), new THREE.ShadowMaterial({ opacity: .28 })); shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);
const LIGHTS = {
  morning: { sun: "#FFF2DE", si: 1.7, el: .9, az: .7, hs: "#CFE0EE", hg: "#5A5040", hi: .75, glow: .35, shadow: .25 },
  golden:  { sun: "#FFB56E", si: 1.9, el: .35, az: 2.2, hs: "#B9C2D8", hg: "#6A4E3A", hi: .55, glow: .7, shadow: .34 },
  night:   { sun: "#8FA8D8", si: .35, el: .8, az: -.6, hs: "#3A4A6A", hg: "#1A1820", hi: .35, glow: 2.2, shadow: .2 }
};
let lightKey = "golden";
function applyLight(k){
  lightKey = k; const L = LIGHTS[k];
  sun.color.set(L.sun); sun.intensity = L.si; hemi.color.set(L.hs); hemi.groundColor.set(L.hg); hemi.intensity = L.hi; shadowCatcher.material.opacity = L.shadow;
  emissives.forEach(e => { if (e.sprite) e.sprite.material.opacity = Math.min(1, e.base*(k === "night" ? 1 : k === "golden" ? .55 : .2)); if (e.plight) e.plight.intensity = k === "night" ? e.base*1.6 : k === "golden" ? e.base*.4 : 0; if (e.m) e.m.emissiveIntensity = e.base*L.glow; if (e.light) e.light.userData.k = k === "night" ? 1.6 : k === "golden" ? .8 : .35; });
  document.getElementById("stage").className = "stage " + k;
  document.querySelectorAll("#light button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === k));
  placeSun();
}
document.querySelectorAll("#light button").forEach(b => b.onclick = () => applyLight(b.dataset.l));

const mainCam = new THREE.PerspectiveCamera(32, 1, .05, 400);
const ortho = { front: new THREE.OrthographicCamera(), side: new THREE.OrthographicCamera(), back: new THREE.OrthographicCamera(), top: new THREE.OrthographicCamera() };
let current = null, bbox = new THREE.Box3(), size = new THREE.Vector3(), center = new THREE.Vector3();
const view = { yaw: -.65, el: .28, dist: 10, auto: true, idle: 0 };
function placeSun(){ const L = LIGHTS[lightKey], R = Math.max(size.x, size.y, size.z)*2 + 6; sun.position.set(center.x + Math.cos(L.az)*Math.cos(L.el)*R, Math.sin(L.el)*R, center.z + Math.sin(L.az)*Math.cos(L.el)*R); sun.target.position.copy(center); const s = Math.max(size.x, size.z, size.y)*1.1 + 1; Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: .1, far: R*3 }); sun.shadow.camera.updateProjectionMatrix(); }

const ORDER = ["Vehicles","Nature","Trail","Buildings","Huts","Props","Life"]; A.sort((a, b) => ORDER.indexOf(a.grp) - ORDER.indexOf(b.grp));
const index = document.getElementById("index");
let lastGrp = "";
A.forEach(a => {
  if (a.grp !== lastGrp){ const p = document.createElement("p"); p.className = "grp"; p.textContent = a.grp.toUpperCase(); index.appendChild(p); lastGrp = a.grp; }
  const b = document.createElement("button"); b.textContent = a.name; b.dataset.id = a.id; b.onclick = () => select(a.id); index.appendChild(b);
});
const link = document.createElement("a"); link.href = "https://claude.ai/artifact/K66C16dMg3YoLG49cn1x7v"; link.textContent = "Atlas →"; link.target = "_blank"; link.rel = "noopener"; index.appendChild(link);
const link2 = document.createElement("a"); link2.href = "https://claude.ai/artifact/RrUnH9n7r41jMRQ4PsWFNN"; link2.textContent = "Screens →"; link2.target = "_blank"; link2.rel = "noopener"; link2.style.marginTop = "8px"; index.appendChild(link2);

function select(id){
  const a = A.find(x => x.id === id);
  if (current){ scene.remove(current.obj); }
  emissives.length = 0; matCache.clear();
  const obj = a.build(); scene.add(obj);
  current = { a, obj };
  obj.updateMatrixWorld(true);
  bbox.setFromObject(obj); bbox.getSize(size); bbox.getCenter(center);
  view.dist = (obj.userData.camHint || Math.max(size.x, size.y*1.3, size.z))*2.15 + .5;
  document.querySelectorAll("#index button").forEach(b => b.setAttribute("aria-current", b.dataset.id === id));
  document.getElementById("name").textContent = a.name;
  document.getElementById("dims").textContent = a.dims;
  document.getElementById("pal").innerHTML = a.pal.map(([n, h]) => `<div class="sw"><i style="background:${h.split(" ")[0]}"></i>${n}<br>${h}</div>`).join("");
  document.getElementById("notes").innerHTML = a.notes.map(n => `<li>${n}</li>`).join("");
  document.getElementById("fix").textContent = a.fix;
  document.getElementById("port").innerHTML = a.port;
  document.getElementById("eFront").textContent = size.x.toFixed(2) + " m wide";
  document.getElementById("eSide").textContent = size.z.toFixed(2) + " m long";
  document.getElementById("eTop").textContent = size.y.toFixed(2) + " m tall";
  for (const [k, cam] of Object.entries(ortho)){
    const half = (k === "top" ? Math.max(size.x, size.z) : Math.max(k === "side" ? size.z : size.x, size.y))*.62 + .1;
    Object.assign(cam, { left: -half, right: half, top: half, bottom: -half, near: .01, far: 200 }); cam.updateProjectionMatrix();
    const D = 60;
    if (k === "front"){ cam.position.set(center.x, center.y, center.z - D); cam.up.set(0,1,0); }
    if (k === "back"){ cam.position.set(center.x, center.y, center.z + D); cam.up.set(0,1,0); }
    if (k === "side"){ cam.position.set(center.x + D, center.y, center.z); cam.up.set(0,1,0); }
    if (k === "top"){ cam.position.set(center.x, center.y + D, center.z); cam.up.set(0,0,-1); }
    cam.lookAt(center);
  }
  applyLight(lightKey);
}

// input on the stage
const stage = document.getElementById("stage");
let drag = null;
stage.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; stage.setPointerCapture(e.pointerId); view.auto = false; view.idle = 0; });
stage.addEventListener("pointermove", e => { if (!drag) return; view.yaw -= (e.clientX - drag.x)*.008; view.el = Math.max(-.05, Math.min(1.3, view.el + (e.clientY - drag.y)*.006)); drag = { x: e.clientX, y: e.clientY }; });
stage.addEventListener("pointerup", () => { drag = null; });
stage.addEventListener("wheel", e => { e.preventDefault(); view.dist *= Math.exp(e.deltaY*.001); view.idle = 0; }, { passive: false });

const rectOf = el => el.getBoundingClientRect();
let lastT = performance.now(), T = 0, spin = 0;
function render(now){
  requestAnimationFrame(render);
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now; T += dt;
  if (!current) return;
  if (!drag){ view.idle += dt; if (view.idle > 3) view.auto = true; }
  spin += ((view.auto ? .22 : 0) - spin)*(1 - Math.exp(-2*dt));
  view.yaw += spin*dt;
  if (current.obj.userData.update) current.obj.userData.update(T);
  const W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.floor(W*renderer.getPixelRatio()) || canvas.height !== Math.floor(H*renderer.getPixelRatio())) renderer.setSize(W, H, false);
  renderer.setScissorTest(false); renderer.clear();
  renderer.setScissorTest(true);
  const draw = (el, cam, isMain) => {
    const r = rectOf(el); if (r.bottom < 0 || r.top > H || r.width < 2) return;
    const y = H - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
    if (isMain){ cam.aspect = r.width/r.height; cam.updateProjectionMatrix(); }
    else { const a = r.width/r.height; if (Math.abs(a - 1) > .01){ const h = (cam.top - cam.bottom)/2; cam.left = -h*a; cam.right = h*a; cam.updateProjectionMatrix(); } }
    renderer.render(scene, cam);
  };
  const c = center, d = view.dist;
  mainCam.position.set(c.x + Math.sin(view.yaw)*Math.cos(view.el)*d, c.y + Math.sin(view.el)*d, c.z + Math.cos(view.yaw)*Math.cos(view.el)*d);
  mainCam.lookAt(c.x, c.y*.9, c.z);
  draw(stage, mainCam, true);
  draw(document.getElementById("vFront"), ortho.front);
  draw(document.getElementById("vSide"), ortho.side);
  draw(document.getElementById("vBack"), ortho.back);
  draw(document.getElementById("vTop"), ortho.top);
}
select("mule");
requestAnimationFrame(render);
})();
</script>
